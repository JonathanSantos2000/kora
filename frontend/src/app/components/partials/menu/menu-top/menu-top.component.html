<header class="conteiner-menu-top">
  <!-- LOGO -->
  <div class="logo">
    <img src="assets/logo/Logo_retangulo_sem_fundo.png" alt="Logo do sistema" />
    <hr />
  </div>

  <!-- USUÁRIO -->
  <div class="user" *ngIf="user.UsuNom">
    <div class="name">
      <h1>{{ user.UsuNom }}</h1>
    </div>

    <button
      class="icon"
      type="button"
      (click)="openMenu()"
      aria-label="Abrir menu do usuário"
    >
      <div class="user-icon">
        <i class="bi bi-person-circle"></i>
      </div>
      <div class="options-icon">
        <i class="bi bi-caret-down-fill"></i>
      </div>
    </button>
  </div>

  <!-- NOTIFICAÇÃO -->
  <button
    class="notification"
    *ngIf="user.UsuNom"
    type="button"
    aria-label="Notificações"
  >
    <i class="bi bi-bell"></i>
  </button>

  <!-- MENU DROPDOWN (AGORA ANCORADO AO HEADER) -->
  <nav class="menu-itens" [class.menuClass]="menuVariable">
    <ul class="sub_menu">
      <li>
        <a href="#">Perfil</a>
      </li>

      <li id="logout">
        <a (click)="logout()">Sair</a>
      </li>
    </ul>
  </nav>
</header>
